<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentWatch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23121823'/%3E%3Cg fill='%2358a6ff'%3E%3Crect x='19.6' y='21.1' width='5.6' height='21.8' rx='2.8'/%3E%3Crect x='29.2' y='15.4' width='5.6' height='33.2' rx='2.8'/%3E%3Crect x='38.8' y='19.2' width='5.6' height='25.6' rx='2.8'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1015;
    --panel:#0d1015;
    --side:#0a0d11;
    --top:#12151a;
    --line:#1b2028;
    --fg:#e6e8eb;
    --muted:#8b929c;
    --dim:#6b7280;

    --c-task:#e5c07b;
    --c-think:#c678dd;
    --c-call:#56b6c2;
    --c-ok:#7ee787;
    --c-err:#ff7b72;
    --c-reply:#5ac8fa;
    --c-sys:#61afef;
    --c-warn:#d19a66;

    --font:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font-family:var(--font);font-size:15px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{background:#26405f}

  .app{display:flex;height:100vh}

  /* ---------------- 侧栏 ---------------- */
  .side{
    width:288px;flex:0 0 288px;background:var(--side);
    display:flex;flex-direction:column;border-right:1px solid var(--line);
  }
  .brand{padding:18px 16px 12px}
  .brand .name{font-size:15px;font-weight:600;letter-spacing:.3px}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:2px}

  .field{padding:0 12px 10px;position:relative}
  .combo{position:relative}
  .kw{
    width:100%;background:#12161c;border:1px solid #20262f;border-radius:7px;
    color:var(--fg);font-family:var(--font);font-size:13px;padding:7px 30px 7px 10px;
    outline:none;transition:border-color .15s;
  }
  .kw:focus{border-color:#2f4a6b}
  .kw::placeholder{color:#4d545e}
  .combo .caret{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:0;color:#5b636e;cursor:pointer;font-size:11px;
    padding:4px 6px;line-height:1;
  }
  .combo .caret:hover{color:#c3cad3}

  /* 项目候选：与树一致的分组面板，不用系统 datalist */
  .menu{
    position:absolute;left:12px;right:12px;top:100%;z-index:40;margin-top:4px;
    max-height:min(52vh,420px);overflow-y:auto;
    background:#11151b;border:1px solid #232a34;border-radius:9px;
    box-shadow:0 14px 34px rgba(0,0,0,.55);padding:5px;
  }
  .menu[hidden]{display:none}
  .menu .grp{
    font-size:10.5px;color:#5f6671;letter-spacing:.4px;
    padding:7px 9px 4px;text-transform:uppercase;
  }
  .menu .opt{
    display:flex;align-items:center;gap:8px;
    padding:6px 9px;border-radius:6px;cursor:pointer;font-size:12.5px;color:#c3cad3;
  }
  .menu .opt:hover{background:#182029}
  .menu .opt.on{background:#16202c;color:#e6edf5}
  .menu .opt .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu .opt .c{font-family:var(--mono);font-size:10.5px;color:#5f6671}
  .menu .empty{padding:10px;font-size:12px;color:#5f6671}

  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 16px 8px;font-size:12px;color:var(--dim);
  }
  .sec-head button{
    background:none;border:0;color:#5b636e;cursor:pointer;font-size:14px;
    padding:0 2px;line-height:1;
  }
  .sec-head button:hover{color:var(--fg)}

  /* 历史会话：智能体 › 项目 › 会话 三级树 */
  .tree{flex:1;overflow-y:auto;padding:0 8px 16px;font-size:13px}
  .tree::-webkit-scrollbar{width:8px}
  .tree::-webkit-scrollbar-thumb{background:#1e242d;border-radius:4px}

  .node > .row{
    display:flex;align-items:center;gap:7px;
    padding:6px 8px;border-radius:6px;cursor:pointer;user-select:none;
  }
  .node > .row:hover{background:#12171e}
  .node > .row .tw{
    width:10px;flex:0 0 10px;color:#5b636e;font-size:9px;line-height:1;
    transition:transform .12s;display:inline-block;
  }
  .node.open > .row .tw{transform:rotate(90deg)}
  .node > .row .folder{flex:0 0 auto;color:#7c8794;display:inline-flex}
  .node.agent > .row .label{font-size:12.5px;color:#dfe4ea;font-weight:600}
  .node.proj  > .row .label{font-size:12.5px;color:#c3cad3}
  .node > .row .count{
    margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#5f6671;
  }
  .node > .kids{display:none}
  .node.open > .kids{display:block}
  .node.proj > .kids{padding-left:18px}
  .node.agent > .kids{padding-left:6px}

  .sitem{
    display:flex;align-items:baseline;gap:8px;
    padding:6px 8px 6px 24px;border-radius:6px;cursor:pointer;
  }
  .sitem:hover{background:#12171e}
  .sitem.active{background:#16202c}
  .sitem .stitle{
    flex:1;min-width:0;font-size:12.5px;color:#b9c0ca;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sitem.active .stitle{color:#e8eef6}
  .sitem .stime{flex:0 0 auto;font-size:10.5px;color:#5f6671}
  .tree .hint{padding:10px 10px;font-size:12px;color:#5f6671}

  /* ---------------- 主区 ---------------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}

  .top{
    display:flex;align-items:center;gap:9px;
    padding:12px 18px;background:var(--top);border-bottom:1px solid var(--line);
  }
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--c-task);
    flex:0 0 auto;
  }
  .dot.pulse{animation:breathe 2.2s ease-in-out infinite}
  @keyframes breathe{
    0%,100%{opacity:.45;transform:scale(.82)}
    50%{opacity:1;transform:scale(1)}
  }
  #status{font-size:13.5px;font-weight:600;color:var(--c-task)}
  .top .sep{color:#39414c}
  #session{font-size:13px;color:#aeb5bf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow{flex:1}
  .btn{
    background:#171c24;border:1px solid #232a34;color:#b7bec8;
    font-family:var(--font);font-size:12.5px;padding:5px 13px;border-radius:7px;
    cursor:pointer;transition:background .12s,border-color .12s;
  }
  .btn:hover{background:#1e242e;border-color:#2e3743}
  .btn.on{background:#243347;border-color:#365a86;color:#cfe3ff}
  .btn.pin{background:#2a2214;border-color:#4a3a20;color:#d7a768;padding:4px 11px}
  .btn.pin:hover{background:#332917;border-color:#5c4826}
  .btn[hidden]{display:none}

  /* 定时刷新：每隔几秒向服务端补拿增量，SSE 静默断掉也不会停住 */
  .ival{
    display:flex;align-items:center;gap:5px;
    font-size:12px;color:#6b7280;white-space:nowrap;
  }
  .ival select{
    background:#171c24;border:1px solid #232a34;color:#b7bec8;
    font-family:var(--font);font-size:12px;border-radius:6px;
    padding:4px 6px;cursor:pointer;outline:none;
  }
  .ival select:focus{border-color:#2f4a6b}

  .stream{
    flex:1;overflow-y:auto;padding:16px 22px 60px;
    scroll-behavior:auto;
  }
  .stream::-webkit-scrollbar{width:10px}
  .stream::-webkit-scrollbar-thumb{background:#222932;border-radius:6px;border:2px solid var(--panel)}
  .stream::-webkit-scrollbar-track{background:transparent}

  /* ---------------- 事件 ---------------- */
  .ev{margin:0 0 3px;padding:2px 0}
  .ev .head{display:flex;align-items:center;gap:8px;height:26px}
  .ev .gut{font-family:var(--mono);font-size:13px;width:14px;flex:0 0 14px;text-align:center}
  .ev .ts{font-family:var(--mono);font-size:11.5px;color:#5f6671}
  .ev .lbl{font-size:12.5px;font-weight:600}

  .ev .bd{padding-left:22px;font-size:15px;line-height:1.78}
  .ev.think .bd{color:#a9b0ba}
  .ev.result_ok .bd,.ev.result_error .bd{font-size:14.5px}

  /* 正文内部元素 */
  .bd .ln{white-space:pre-wrap;word-break:break-word}
  .bd .gap{height:9px}
  .bd .h{color:#79c0ff;font-weight:600;margin:4px 0 2px}
  .bd .li{position:relative;padding-left:16px;white-space:pre-wrap;word-break:break-word}
  .bd .li::before{
    content:"";position:absolute;left:4px;top:.72em;
    width:4px;height:4px;border-radius:50%;background:#4b5563;
  }
  .bd .li.num::before{display:none}
  .bd .li.num{padding-left:4px}
  .bd hr{border:0;border-top:1px solid var(--line);margin:9px 0}
  .bd .fold{
    color:#5b636e;font-size:13px;font-style:normal;
    padding:3px 0;
  }
  .bd .fold::before{content:"⋯ ";opacity:.7}

  .bd code{
    font-family:var(--mono);font-size:13px;
    background:#181d24;color:#d5dae1;
    padding:1px 5px;border-radius:4px;
    border:1px solid #222932;
  }
  /* 表格：转成真表格，不再把 | 一行行摊开 */
  .bd .tbl{overflow-x:auto;margin:8px 0;max-width:100%}
  .bd table{
    border-collapse:collapse;font-size:13px;
    border:1px solid #232a34;border-radius:6px;overflow:hidden;
  }
  .bd th,.bd td{
    border:1px solid #20262f;padding:5px 11px;
    vertical-align:top;line-height:1.6;
  }
  .bd th{
    background:#161c24;color:#cfd7e1;font-weight:600;white-space:nowrap;
    text-align:left;
  }
  .bd td{color:#b6bdc7}
  .bd tbody tr:nth-child(even) td{background:#11161c}
  .bd td code{font-size:12px;white-space:nowrap}
  .bd td .li,.bd td .ln{display:inline}
  .bd strong{color:#fff;font-weight:600}
  .bd .wl{color:#8ab4f8;border-bottom:1px dotted #3f587c;cursor:default}
  .bd .lnk{color:#8ab4f8}
  .bd pre.code{
    font-family:var(--mono);font-size:13px;line-height:1.65;
    background:#12171d;border:1px solid #1d232b;border-radius:7px;
    padding:9px 12px;margin:6px 0;overflow-x:auto;color:#c8cdd4;
  }

  /* 任务/回复卡片 */
  .ev.task,.ev.reply{
    background:#11151b;border:1px solid #1a2028;border-radius:9px;
    padding:9px 14px;margin:12px 0 6px;
  }
  .ev.reply{background:#0f141a}

  .banner{
    display:flex;align-items:center;gap:10px;
    color:#4e5763;font-size:12.5px;margin:20px 0 10px;
  }
  .banner::before,.banner::after{content:"";flex:1;height:1px;background:#1b2028}

  .jump{
    position:fixed;right:26px;bottom:22px;
    background:#1b2330;border:1px solid #2b3646;color:#9fb4cc;
    font-size:12.5px;padding:6px 14px;border-radius:16px;cursor:pointer;
    display:none;
  }
  .jump.show{display:block}

  /* 没连上本地服务时的提示条 */
  .offline{
    position:fixed;left:0;right:0;top:0;z-index:60;display:none;
    align-items:center;gap:8px;padding:10px 18px;
    background:#2a1f14;border-bottom:1px solid #4a3620;
    color:#d7a768;font-size:13px;
  }
  .offline.show{display:flex}
  .offline b{color:#ffd08a;font-weight:600}
</style>
</head>
<body>
<div id="offline" class="offline">
  <span>未连接到本地服务 ·</span>
  <b>请双击 AgentWatch.exe 启动</b>
  <span>（单独打开这个网页文件没有数据源）</span>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="name">AgentWatch</div>
      <div class="sub">本机智能体会话 · 实时</div>
    </div>

    <div class="field">
      <div class="combo">
        <input id="kw" class="kw" placeholder="全部项目" autocomplete="off" spellcheck="false">
        <button id="kw-toggle" class="caret" title="选择项目">▼</button>
      </div>
      <div id="kw-menu" class="menu" hidden></div>
    </div>

    <div class="sec-head">
      <span>历史会话</span>
      <button id="refresh" title="重新扫描">⟳</button>
    </div>
    <div id="tree" class="tree"></div>
  </aside>

  <main class="main">
    <header class="top">
      <span id="dot" class="dot pulse"></span>
      <span id="status">等待中</span>
      <span class="sep">·</span>
      <span id="session">—</span>
      <button id="unpin" class="btn pin" hidden title="恢复自动跟随最新会话">取消固定</button>
      <span class="grow"></span>
      <label class="ival" title="每隔一段时间向服务端补拿增量，即使推送中断画面也会继续更新">
        <span>刷新</span>
        <select id="interval">
          <option value="0">关</option>
          <option value="3000">3 秒</option>
          <option value="5000">5 秒</option>
          <option value="10000">10 秒</option>
        </select>
      </label>
      <button id="pause" class="btn">暂停</button>
      <button id="clear" class="btn">清空</button>
    </header>
    <div id="stream" class="stream"></div>
    <button id="jump" class="jump">回到底部</button>
  </main>
</div>

<script>
(function(){
  "use strict";

  const KIND = {
    task:        {gut:"▌", color:"var(--c-task)",  cls:"task"},
    think:       {gut:"▌", color:"var(--c-think)", cls:"think"},
    call:        {gut:"▸", color:"var(--c-call)",  cls:"call"},
    result_ok:   {gut:"✔", color:"var(--c-ok)",    cls:"result_ok"},
    result_error:{gut:"✖", color:"var(--c-err)",   cls:"result_error"},
    reply:       {gut:"◆", color:"var(--c-reply)", cls:"reply"},
    system:      {gut:"·", color:"var(--c-sys)",   cls:"system"},
    warning:     {gut:"!", color:"var(--c-warn)",  cls:"warning"}
  };

  const streamEl = document.getElementById("stream");
  const treeEl = document.getElementById("tree");
  const statusEl = document.getElementById("status");
  const sessionNameEl = document.getElementById("session");
  const dotEl = document.getElementById("dot");
  const pauseBtn = document.getElementById("pause");
  const clearBtn = document.getElementById("clear");
  const kwInput = document.getElementById("kw");
  const kwMenu = document.getElementById("kw-menu");
  const kwToggle = document.getElementById("kw-toggle");
  const refreshBtn = document.getElementById("refresh");
  const jumpBtn = document.getElementById("jump");
  const offlineEl = document.getElementById("offline");
  const intervalSel = document.getElementById("interval");
  const unpinBtn = document.getElementById("unpin");

  let connectedOnce = false;
  let offlineTimer = null;
  let es = null;                 // 当前 SSE 连接
  let lastSeq = 0;               // 已渲染到的最后一条事件序号
  let lastMsgAt = Date.now();    // 最后一次收到任何消息（含心跳）的时刻
  let lastSessionsAt = 0;        // 上次刷新侧栏树的时刻
  let refreshTimer = null;

  function setOffline(on){
    offlineEl.classList.toggle("show", on);
  }

  let paused = false;
  let buffered = [];
  let stickBottom = true;

  // ---------------- 文本清洗 ----------------
  function esc(s){
    return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  }

  function shortPath(p){
    const parts = String(p).split(/[\\/]+/).filter(Boolean);
    if (parts.length <= 2) return p;
    return "…/" + parts.slice(-2).join("/");
  }

  function inline(s){
    let out = esc(s);
    out = out.replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`);
    out = out.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
    out = out.replace(/\[\[([^\]\n]+)\]\]/g, (_, inner) => {
      const bar = inner.indexOf("|");
      const target = bar >= 0 ? inner.slice(0, bar) : inner;
      const text = bar >= 0 ? inner.slice(bar + 1) : shortPath(target);
      return `<span class="wl" title="${target}">${text}</span>`;
    });
    out = out.replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g, (_, t) => `<span class="lnk">${t}</span>`);
    return out;
  }

  // ---------------- 表格 ----------------
  function isTableRow(t){
    return t.length > 1 && t.startsWith("|");
  }

  function splitRow(t){
    let body = t.trim();
    if (body.startsWith("|")) body = body.slice(1);
    if (body.endsWith("|")) body = body.slice(0, -1);
    return body.split("|").map(cell => cell.trim());
  }

  function isTableSep(t){
    if (!isTableRow(t)) return false;
    const cells = splitRow(t);
    return cells.length > 0 && cells.every(c => /^:?-{1,}:?$/.test(c.replace(/\s/g, "")));
  }

  function cellAlign(cell){
    const c = cell.replace(/\s/g, "");
    const left = c.startsWith(":"), right = c.endsWith(":");
    if (left && right) return "center";
    if (right) return "right";
    if (left) return "left";
    return "";
  }

  function buildTable(header, aligns, rows){
    const attr = idx => (aligns[idx] ? ` style="text-align:${aligns[idx]}"` : "");
    let out = '<div class="tbl"><table><thead><tr>';
    header.forEach((cell, idx) => { out += `<th${attr(idx)}>${inline(cell)}</th>`; });
    out += "</tr></thead><tbody>";
    rows.forEach(cells => {
      out += "<tr>";
      for (let idx = 0; idx < header.length; idx++){
        out += `<td${attr(idx)}>${inline(cells[idx] || "")}</td>`;
      }
      out += "</tr>";
    });
    return out + "</tbody></table></div>";
  }

  function renderBody(text){
    const lines = String(text == null ? "" : text).replace(/\r/g, "").split("\n");
    const parts = [];
    let i = 0;

    // 顶部的 YAML frontmatter 整块折叠掉，不占版面
    if (lines.length > 1 && lines[0].trim() === "---"){
      let j = 1;
      while (j < lines.length && lines[j].trim() !== "---") j++;
      if (j < lines.length && j - 1 <= 40){
        parts.push(`<div class="fold">省略元数据 ${j - 1} 行</div>`);
        i = j + 1;
      }
    }

    let inCode = false;
    const codeBuf = [];

    for (; i < lines.length; i++){
      const raw = lines[i];
      const t = raw.trim();

      if (t.startsWith("```")){
        if (inCode){
          parts.push(`<pre class="code">${esc(codeBuf.join("\n"))}</pre>`);
          codeBuf.length = 0;
          inCode = false;
        } else {
          inCode = true;
        }
        continue;
      }
      if (inCode){ codeBuf.push(raw); continue; }

      if (!t){ parts.push('<div class="gap"></div>'); continue; }
      if (t === "---" || t === "***" || t === "___"){ parts.push("<hr>"); continue; }
      if (/^#{1,6}\s+/.test(t)){
        parts.push(`<div class="h">${inline(t.replace(/^#{1,6}\s+/, ""))}</div>`);
        continue;
      }
      if (/^[-*+]\s+/.test(t)){
        parts.push(`<div class="li">${inline(t.replace(/^[-*+]\s+/, ""))}</div>`);
        continue;
      }
      if (/^\d+[.)]\s+/.test(t)){
        parts.push(`<div class="li num">${inline(t)}</div>`);
        continue;
      }
      if (t.startsWith("⋯")){
        parts.push(`<div class="fold">${esc(t.replace(/^⋯\s*/, ""))}</div>`);
        continue;
      }
      // 管道表格：| a | b | 加下一行的 |---|:--:| 才算数
      if (isTableRow(t) && isTableSep((lines[i + 1] || "").trim())){
        const header = splitRow(t);
        const aligns = splitRow((lines[i + 1] || "").trim()).map(cellAlign);
        const rows = [];
        i += 2;
        while (i < lines.length && isTableRow(lines[i].trim())){
          rows.push(splitRow(lines[i].trim()));
          i++;
        }
        i--;                       // 外层 for 还要 ++
        parts.push(buildTable(header, aligns, rows));
        continue;
      }
      parts.push(`<div class="ln">${inline(raw)}</div>`);
    }

    if (inCode && codeBuf.length){
      parts.push(`<pre class="code">${esc(codeBuf.join("\n"))}</pre>`);
    }
    return parts.join("");
  }

  function fmtTime(ms){
    const d = ms ? new Date(ms) : new Date();
    const p = n => String(n).padStart(2, "0");
    return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  // ---------------- 渲染 ----------------
  function isBanner(msg){
    return msg.kind === "system" && /切换到|固定会话/.test(msg.text || "");
  }

  function renderEvent(msg){
    if (isBanner(msg)){
      const el = document.createElement("div");
      el.className = "banner";
      el.textContent = (msg.text || "").replace(/^\[系统\]\s*/, "");
      streamEl.appendChild(el);
      return;
    }

    const k = KIND[msg.kind] || KIND.system;
    const el = document.createElement("div");
    el.className = "ev " + k.cls;

    const time = msg.ts ? fmtTime(msg.ts) : "";
    const label = msg.label ? esc(msg.label) : "";

    el.innerHTML =
      `<div class="head">` +
        `<span class="gut" style="color:${k.color}">${k.gut}</span>` +
        (time ? `<span class="ts">${time}</span>` : "") +
        (label ? `<span class="lbl" style="color:${k.color}">${label}</span>` : "") +
      `</div>` +
      `<div class="bd">${renderBody(msg.text)}</div>`;

    streamEl.appendChild(el);
  }

  function pushEvent(msg){
    // 序号去重：SSE 和定时轮询可能同时送来同一条
    if (typeof msg.seq === "number"){
      if (msg.seq <= lastSeq) return;
      lastSeq = msg.seq;
    }
    if (paused){ buffered.push(msg); return; }
    renderEvent(msg);
    if (stickBottom) streamEl.scrollTop = streamEl.scrollHeight;
  }

  function setStatus(text){
    const raw = String(text || "");
    const pinned = /固定/.test(raw);
    const live = !pinned && /跟随|同步|切换/.test(raw);
    statusEl.textContent = pinned ? "已固定 · 不自动跟随"
                                  : (raw || "等待中");
    dotEl.classList.toggle("pulse", live);
    dotEl.style.background = live ? "var(--c-task)" : (pinned ? "#d7a768" : "#5b636e");
    statusEl.style.color = live ? "var(--c-task)" : (pinned ? "#d7a768" : "#9aa1ab");
    unpinBtn.hidden = !pinned;
  }

  // ---------------- 侧栏：智能体 › 项目 › 会话 ----------------
  let treeData = [];                 // [{id,label,count,projects:[{key,name,count}]}]
  const openNodes = new Set();       // "a:<agent>" / "p:<agent>|<project>"
  const sessionsCache = new Map();   // "<agent>|<project>" -> [{path,ts,preview}]
  let currentPath = "";
  let currentKeyword = "";

  const FOLDER = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 7.6A1.6 1.6 0 0 1 4.6 6h3.9l1.6 2.1h7.3A1.6 1.6 0 0 1 19 9.7v7.1A1.6 1.6 0 0 1 17.4 18.5H4.6A1.6 1.6 0 0 1 3 16.9z"/></svg>';

  function el(tag, cls){
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    return node;
  }

  function relTime(ts){
    if (!ts) return "";
    const diff = Date.now() - ts;
    if (diff < 60e3) return "刚刚";
    if (diff < 3600e3) return Math.floor(diff / 60e3) + " 分钟前";
    if (diff < 86400e3) return Math.floor(diff / 3600e3) + " 小时前";
    if (diff < 7 * 86400e3) return Math.floor(diff / 86400e3) + " 天前";
    const d = new Date(ts);
    return `${d.getMonth() + 1}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function nodeRow(label, count){
    const row = el("div", "row");
    row.innerHTML =
      `<span class="tw">▸</span><span class="folder">${FOLDER}</span>` +
      `<span class="label">${esc(label)}</span>` +
      `<span class="count">${count || ""}</span>`;
    return row;
  }

  function matchesFilter(name){
    if (!currentKeyword) return true;
    return String(name).toLowerCase().includes(currentKeyword.toLowerCase());
  }

  function renderTree(){
    if (!treeData.length){
      treeEl.innerHTML = '<div class="hint">没有找到会话目录</div>';
      return;
    }
    treeEl.innerHTML = "";
    let shown = 0;
    treeData.forEach(agent => {
      const projects = agent.projects.filter(p => matchesFilter(p.name));
      if (!projects.length) return;
      shown += 1;

      const akey = "a:" + agent.id;
      const an = el("div", "node agent" + (openNodes.has(akey) ? " open" : ""));
      const arow = nodeRow(agent.label, projects.reduce((sum, p) => sum + p.count, 0));
      arow.onclick = () => {
        if (openNodes.has(akey)) openNodes.delete(akey);
        else openNodes.add(akey);
        renderTree();
      };
      an.appendChild(arow);

      const akids = el("div", "kids");
      if (openNodes.has(akey)){
        projects.forEach(proj => akids.appendChild(buildProject(agent, proj)));
      }
      an.appendChild(akids);
      treeEl.appendChild(an);
    });
    if (!shown){
      treeEl.innerHTML = `<div class="hint">没有匹配「${esc(currentKeyword)}」的项目</div>`;
    }
    markActive();
  }

  function buildProject(agent, proj){
    const pkey = "p:" + agent.id + "|" + proj.key;
    const pn = el("div", "node proj" + (openNodes.has(pkey) ? " open" : ""));
    const prow = nodeRow(proj.name, proj.count);
    prow.onclick = () => {
      if (openNodes.has(pkey)){
        openNodes.delete(pkey);
        renderTree();
        return;
      }
      openNodes.add(pkey);
      renderTree();
      if (!sessionsCache.has(agent.id + "|" + proj.key))
        loadProjectSessions(agent.id, proj.key);
    };
    pn.appendChild(prow);

    const kids = el("div", "kids");
    if (openNodes.has(pkey)){
      const list = sessionsCache.get(agent.id + "|" + proj.key);
      if (list === undefined || list === null){
        kids.innerHTML = '<div class="hint">读取中…</div>';
      } else if (!list.length){
        kids.innerHTML = '<div class="hint">没有会话</div>';
      } else {
        list.forEach(item => kids.appendChild(buildSession(item)));
      }
    }
    pn.appendChild(kids);
    return pn;
  }

  function buildSession(item){
    const row = el("div", "sitem");
    row.dataset.path = item.path;
    row.title = item.path;
    row.innerHTML =
      `<div class="stitle">${esc(item.preview || "")}</div>` +
      `<div class="stime">${relTime(item.ts)}</div>`;
    row.onclick = () => {
      currentPath = item.path;
      markActive();
      send({op: "pin_session", value: item.path, label: item.preview || ""});
    };
    return row;
  }

  function markActive(){
    [...treeEl.querySelectorAll(".sitem")].forEach(node => {
      node.classList.toggle("active", node.dataset.path === currentPath);
    });
  }

  async function loadProjectSessions(agentId, projectKey, silent){
    const cacheKey = agentId + "|" + projectKey;
    if (!silent){
      sessionsCache.set(cacheKey, null);
      renderTree();
    }
    try {
      const qs = `?agent=${encodeURIComponent(agentId)}&project=${encodeURIComponent(projectKey)}`;
      const data = await (await fetch("/api/sessions" + qs, {cache: "no-store"})).json();
      sessionsCache.set(cacheKey, data.sessions || []);
    } catch (e){
      sessionsCache.set(cacheKey, sessionsCache.get(cacheKey) || []);
    }
    renderTree();
  }

  async function loadTree(){
    let data = {agents: []};
    try {
      data = await (await fetch("/api/tree", {cache: "no-store"})).json();
    } catch (e){ /* 服务未就绪时忽略 */ }
    treeData = data.agents || [];
    if (treeData.length && !openNodes.size) openNodes.add("a:" + treeData[0].id);

    // 已展开的项目静默刷新，新会话会自己冒出来，不会闪「读取中」
    [...openNodes].filter(k => k.startsWith("p:")).forEach(key => {
      const cut = key.slice(2).indexOf("|");
      const bare = key.slice(2);
      loadProjectSessions(bare.slice(0, cut), bare.slice(cut + 1), true);
    });

    renderTree();
    renderMenu();
  }

  // 当前正在跟随的会话：自动展开它所在的项目并高亮
  function applyCurrent(agentId, projectKey, path){
    if (!path) return;
    currentPath = path;
    if (agentId && projectKey){
      openNodes.add("a:" + agentId);
      openNodes.add("p:" + agentId + "|" + projectKey);
      const cacheKey = agentId + "|" + projectKey;
      if (!sessionsCache.has(cacheKey)) loadProjectSessions(agentId, projectKey);
      else markActive();
    } else {
      markActive();
    }
  }

  // ---------------- 项目下拉 ----------------
  function renderMenu(){
    const kw = kwInput.value.trim().toLowerCase();
    kwMenu.innerHTML = "";

    const all = el("div", "opt" + (currentKeyword ? "" : " on"));
    all.innerHTML = '<span class="n">全部项目</span>';
    all.onclick = () => { setKeyword(""); closeMenu(); };
    kwMenu.appendChild(all);

    let count = 0;
    treeData.forEach(agent => {
      const items = agent.projects.filter(p => !kw || p.name.toLowerCase().includes(kw));
      if (!items.length) return;
      const grp = el("div", "grp");
      grp.textContent = agent.label;
      kwMenu.appendChild(grp);
      items.forEach(proj => {
        count += 1;
        const opt = el("div", "opt" + (proj.name === currentKeyword ? " on" : ""));
        opt.innerHTML =
          `<span class="n">${esc(proj.name)}</span><span class="c">${proj.count}</span>`;
        opt.onclick = () => {
          setKeyword(proj.name);
          openNodes.add("a:" + agent.id);
          openNodes.add("p:" + agent.id + "|" + proj.key);
          renderTree();
          if (!sessionsCache.has(agent.id + "|" + proj.key))
            loadProjectSessions(agent.id, proj.key);
          closeMenu();
        };
        kwMenu.appendChild(opt);
      });
    });
    if (!count){
      const empty = el("div", "empty");
      empty.textContent = "没有匹配的项目";
      kwMenu.appendChild(empty);
    }
  }

  function openMenu(){ kwMenu.hidden = false; renderMenu(); }
  function closeMenu(){ kwMenu.hidden = true; }

  function setKeyword(text){
    currentKeyword = text;
    kwInput.value = text;
    send({op: "set_keyword", value: text, label: text || "全部项目"});
    renderTree();
    renderMenu();
  }

  async function send(payload){
    try {
      await fetch("/api/command", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
    } catch (e){ /* 忽略 */ }
  }

  kwToggle.onclick = (e) => {
    e.stopPropagation();
    if (kwMenu.hidden) openMenu(); else closeMenu();
  };
  kwInput.addEventListener("focus", () => openMenu());
  kwInput.addEventListener("input", () => renderMenu());
  kwInput.addEventListener("keydown", e => {
    if (e.key === "Escape"){ closeMenu(); kwInput.blur(); return; }
    if (e.key !== "Enter") return;
    setKeyword(kwInput.value.trim());
    closeMenu();
    kwInput.blur();
  });
  document.addEventListener("click", e => {
    if (kwMenu.hidden) return;
    if (kwMenu.contains(e.target) || e.target === kwInput) return;
    closeMenu();
  });

  refreshBtn.onclick = () => {
    sessionsCache.clear();
    loadTree();
  };

  // ---------------- 交互 ----------------
  pauseBtn.onclick = () => {
    paused = !paused;
    pauseBtn.classList.toggle("on", paused);
    pauseBtn.textContent = paused ? "继续" : "暂停";
    if (!paused && buffered.length){
      buffered.forEach(renderEvent);
      buffered = [];
      streamEl.scrollTop = streamEl.scrollHeight;
    }
  };

  clearBtn.onclick = () => {
    streamEl.innerHTML = "";
    buffered = [];
  };

  streamEl.addEventListener("scroll", () => {
    const gap = streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight;
    stickBottom = gap < 48;
    jumpBtn.classList.toggle("show", !stickBottom);
  });

  jumpBtn.onclick = () => {
    stickBottom = true;
    streamEl.scrollTop = streamEl.scrollHeight;
    jumpBtn.classList.remove("show");
  };

  document.addEventListener("keydown", e => {
    if (!e.ctrlKey) return;
    if (e.key.toLowerCase() === "p"){ e.preventDefault(); pauseBtn.click(); }
    if (e.key.toLowerCase() === "l"){ e.preventDefault(); clearBtn.click(); }
  });

  // ---------------- 事件流 ----------------
  // 两条腿：SSE 负责实时推送；定时轮询负责补断档。
  // 任何一条断了，另一条都能把画面继续往前推。
  function applyState(data){
    (data.events || []).forEach(pushEvent);
    if (data.status) setStatus(data.status);
    if (typeof data.session === "string") sessionNameEl.textContent = data.session || "—";
    if (data.path) applyCurrent(data.agent || "", data.project || "", data.path);
    if (data.dropped && typeof data.seq === "number" && data.seq > lastSeq){
      lastSeq = data.seq;      // 断档太久，服务端只给最近一批，接受它别原地打转
    }
    if (typeof data.refresh_ms === "number" && !refreshTouched){
      applyInterval(data.refresh_ms, false);   // 沿用上次关窗口时的那档
    }
  }

  async function tick(){
    // 不判断 document.hidden：Chrome 的窗口遮挡检测会把被盖住的窗口标成 hidden，
    // 那样轮询会静默停掉，正好又变成「看着不更新」。本机接口，几秒一次可以忽略。
    let data;
    try {
      const resp = await fetch(`/api/state?after=${lastSeq}`, {cache: "no-store"});
      data = await resp.json();
    } catch (e){
      setOffline(true);
      return;
    }
    connectedOnce = true;
    clearTimeout(offlineTimer);
    offlineTimer = null;
    setOffline(false);
    applyState(data);

    // 侧栏跟着刷，新会话会自己冒出来，不用手点 ⟳
    if (Date.now() - lastSessionsAt > 15000){
      lastSessionsAt = Date.now();
      loadTree();
    }
  }

  function connect(){
    if (es){ try { es.close(); } catch (e){ /* 已经关了 */ } }
    const sock = new EventSource("/events");
    es = sock;
    sock.onopen = () => { lastMsgAt = Date.now(); };
    sock.onmessage = ev => {
      lastMsgAt = Date.now();
      connectedOnce = true;
      clearTimeout(offlineTimer);
      offlineTimer = null;
      setOffline(false);
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e){ return; }
      if (msg.type === "ping"){
        // 心跳只用来判断连接是否还活着，不推进 lastSeq
        return;
      }
      if (msg.type === "reset"){
        streamEl.innerHTML = "";
        buffered = [];
        lastSeq = 0;                  // 回放的事件序号比 reset 小，得从 0 重新累积
        setStatus(msg.status || "等待中");
        sessionNameEl.textContent = msg.session || "—";
        lastSessionsAt = Date.now();
        loadTree();
        if (msg.path) applyCurrent(msg.agent || "", msg.project || "", msg.path);
        return;
      }
      if (msg.type === "event"){ pushEvent(msg); return; }
      if (msg.type === "status"){ setStatus(msg.text); return; }
      if (msg.type === "session"){
        sessionNameEl.textContent = msg.text || "—";
        applyCurrent(msg.agent || "", msg.project || "", msg.path || "");
        return;
      }
      if (msg.type === "stats"){ return; }
    };
    sock.onerror = () => {
      if (es !== sock) return;        // 已经被新连接替换，别重复重连
      try { sock.close(); } catch (e){ /* 忽略 */ }
      es = null;
      if (!connectedOnce && !offlineTimer){
        offlineTimer = setTimeout(() => setOffline(true), 1500);
      }
      setTimeout(connect, 1200);
    };
  }

  // 看门狗：18 秒没收到任何东西（连心跳都没有）就重连，防止流静默假死
  setInterval(() => {
    if (Date.now() - lastMsgAt < 18000) return;
    lastMsgAt = Date.now();
    connect();
  }, 5000);

  // 刷新间隔：服务端记着上次的选择（settings.json），前端只负责计时
  const REFRESH_CHOICES = [0, 3000, 5000, 10000];
  let currentInterval = -1;        // -1 保证首次一定会应用并同步下拉框
  let refreshTouched = false;      // 本次动过下拉，就不再被服务端值覆盖

  function applyInterval(ms, fromUser){
    const value = REFRESH_CHOICES.includes(ms) ? ms : 5000;
    if (!fromUser && value === currentInterval) return;   // 没变就别动计时器
    currentInterval = value;
    if (fromUser) send({op: "set_interval", value: String(value), label: ""});
    intervalSel.value = String(value);
    if (refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
    if (value > 0) refreshTimer = setInterval(tick, value);
    if (fromUser && value > 0) tick();
  }

  applyInterval(Number(localStorage.getItem("wb.refresh")) || 5000, false);
  intervalSel.onchange = () => {
    refreshTouched = true;
    localStorage.setItem("wb.refresh", intervalSel.value);
    applyInterval(Number(intervalSel.value), true);
  };

  // 取消固定：回到自动跟随最新会话
  unpinBtn.onclick = () => {
    unpinBtn.hidden = true;
    setKeyword("");
    setStatus("跟随中");
  };

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (Date.now() - lastMsgAt > 12000) connect();
    tick();
  });

  if (location.protocol === "file:"){
    setOffline(true);          // 直接双击 html 打开，注定没有数据源
  } else {
    offlineTimer = setTimeout(() => { if (!connectedOnce) setOffline(true); }, 4000);
  }
  loadTree();
  connect();
})();
</script>
</body>
</html>
